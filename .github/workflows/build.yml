name: Build Multi-Platform

on:
  push:
    branches: [main, master, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-rust-crypto:
    name: Build Rust Crypto Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-crypto-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust Crypto Core
        working-directory: rust-crypto-core
        run: |
          cargo build --release --verbose
          cargo test --release --verbose

  build-tauri:
    name: Build Tauri App (${{ matrix.platform }})
    needs: build-rust-crypto
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            os: "macos"
            arch: "aarch64"
            rust_target: "aarch64-apple-darwin"

          - platform: "ubuntu-22.04"
            os: "linux"
            arch: "x86_64"
            rust_target: "x86_64-unknown-linux-gnu"

          - platform: "windows-latest"
            os: "windows"
            arch: "x86_64"
            rust_target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tauri-desktop/package-lock.json

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-crypto-core/target
            tauri-desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: tauri-desktop/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('tauri-desktop/package-lock.json') }}

      - name: Build Rust Crypto Core
        working-directory: rust-crypto-core
        run: cargo build --release

      - name: Install frontend dependencies
        working-directory: tauri-desktop
        run: npm ci

      - name: Build Tauri App
        working-directory: tauri-desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build

      - name: List build artifacts (debug)
        shell: bash
        run: |
          echo "=== macOS bundles ==="
          ls -lh tauri-desktop/src-tauri/target/release/bundle/macos/ 2>/dev/null || echo "No macOS bundles"

          echo "=== DMG files ==="
          ls -lh tauri-desktop/src-tauri/target/release/bundle/dmg/ 2>/dev/null || echo "No DMG files"

          echo "=== Windows bundles ==="
          ls -lh tauri-desktop/src-tauri/target/release/bundle/msi/ 2>/dev/null || echo "No MSI files"
          ls -lh tauri-desktop/src-tauri/target/release/bundle/nsis/ 2>/dev/null || echo "No NSIS files"

          echo "=== Linux bundles ==="
          ls -lh tauri-desktop/src-tauri/target/release/bundle/deb/ 2>/dev/null || echo "No DEB files"
          ls -lh tauri-desktop/src-tauri/target/release/bundle/appimage/ 2>/dev/null || echo "No AppImage files"
          ls -lh tauri-desktop/src-tauri/target/release/bundle/rpm/ 2>/dev/null || echo "No RPM files"

      - name: Prepare macOS artifacts
        if: matrix.os == 'macos'
        shell: bash
        run: |
          mkdir -p artifacts

          # Copy DMG if exists
          if [ -f tauri-desktop/src-tauri/target/release/bundle/dmg/*.dmg ]; then
            cp tauri-desktop/src-tauri/target/release/bundle/dmg/*.dmg artifacts/
          fi

          # Create DMG from .app if DMG doesn't exist
          if [ -d "tauri-desktop/src-tauri/target/release/bundle/macos/SecureVault.app" ]; then
            if [ ! -f artifacts/*.dmg ]; then
              echo "Creating DMG manually..."
              hdiutil create -volname "SecureVault" -srcfolder "tauri-desktop/src-tauri/target/release/bundle/macos/SecureVault.app" -ov -format UDZO "artifacts/SecureVault_2.0.0_macOS.dmg"
            fi
          fi

      - name: Prepare Windows artifacts
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p artifacts

          # Copy MSI installer
          if compgen -G "tauri-desktop/src-tauri/target/release/bundle/msi/*.msi" > /dev/null; then
            cp tauri-desktop/src-tauri/target/release/bundle/msi/*.msi artifacts/
          fi

          # Copy NSIS installer
          if compgen -G "tauri-desktop/src-tauri/target/release/bundle/nsis/*.exe" > /dev/null; then
            cp tauri-desktop/src-tauri/target/release/bundle/nsis/*.exe artifacts/
          fi

      - name: Prepare Linux artifacts
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p artifacts

          # Copy DEB package
          if compgen -G "tauri-desktop/src-tauri/target/release/bundle/deb/*.deb" > /dev/null; then
            cp tauri-desktop/src-tauri/target/release/bundle/deb/*.deb artifacts/
          fi

          # Copy AppImage
          if compgen -G "tauri-desktop/src-tauri/target/release/bundle/appimage/*.AppImage" > /dev/null; then
            cp tauri-desktop/src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
          fi

          # Copy RPM (if available)
          if compgen -G "tauri-desktop/src-tauri/target/release/bundle/rpm/*.rpm" > /dev/null; then
            cp tauri-desktop/src-tauri/target/release/bundle/rpm/*.rpm artifacts/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: securevault-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

  create-release:
    name: Create Release
    needs: build-tauri
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -R release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-summary:
    name: Build Summary
    needs: build-tauri
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🎉 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-tauri.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms Built:" >> $GITHUB_STEP_SUMMARY
          echo "- 🍎 macOS (ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Linux (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- 🪟 Windows (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "Check the **Artifacts** section below to download builds" >> $GITHUB_STEP_SUMMARY
