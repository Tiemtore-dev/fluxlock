name: Release FluXlock

# ─────────────────────────────────────────────────────────────
# Stratégie 2 repos :
#   - Repo PRIVÉ (fluxlock)         → code source, CI/CD
#   - Repo PUBLIC (fluxlock-releases) → installeurs + latest.json
# Les utilisateurs voient uniquement fluxlock-releases.
# L'updater Tauri pointe sur fluxlock-releases.
# ─────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"

env:
  PUBLIC_REPO: Tiemtore-dev/fluxlock-releases

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        working-directory: ./tauri-desktop
        run: npm ci

      - name: Build frontend
        working-directory: ./tauri-desktop
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # RELEASES_PAT → token avec accès au repo PUBLIC fluxlock-releases
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          # Les binaires sont publiés dans le repo PUBLIC
          owner: Tiemtore-dev
          repo: fluxlock-releases
          projectPath: "./tauri-desktop"
          tagName: ${{ github.ref_name }}
          releaseName: "FluXlock ${{ github.ref_name }}"
          releaseBody: |
            ## 🔐 FluXlock ${{ github.ref_name }}

            Téléchargez l'installeur pour votre système :

            | Plateforme | Fichier |
            |---|---|
            | macOS (Apple Silicon M1/M2/M3) | `FluXlock_*_aarch64.dmg` |
            | macOS (Intel) | `FluXlock_*_x64.dmg` |
            | Windows | `FluXlock_*_x64-setup.exe` |
            | Linux | `FluXlock_*_amd64.AppImage` |

            Voir les changements dans le [CHANGELOG](https://github.com/Tiemtore-dev/fluxlock/blob/main/CHANGELOG.md).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-manifest:
    name: Publish update manifest (latest.json)
    needs: release
    runs-on: ubuntu-22.04

    steps:
      - name: Download release assets from public repo
        uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.RELEASES_PAT }}
          tag: ${{ github.ref_name }}
          fileName: "*.sig"
          out-file-path: "sigs"

      - name: Build latest.json manifest
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BASE_URL="https://github.com/${{ env.PUBLIC_REPO }}/releases/download/${{ github.ref_name }}"

          get_sig() {
            local f
            f=$(ls sigs/$1 2>/dev/null | head -1)
            [ -f "$f" ] && cat "$f" || echo ""
          }

          cat > latest.json << EOF
          {
            "version": "${{ github.ref_name }}",
            "notes": "FluXlock ${{ github.ref_name }} — voir CHANGELOG pour les détails.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(get_sig "FluXlock_aarch64.app.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "$(get_sig "FluXlock_x64.app.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_x64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "$(get_sig "FluXlock_${VERSION}_amd64.AppImage.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_${VERSION}_amd64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$(get_sig "FluXlock_${VERSION}_x64_en-US.msi.zip.sig")",
                "url": "${BASE_URL}/FluXlock_${VERSION}_x64_en-US.msi.zip"
              }
            }
          }
          EOF

          echo "=== latest.json généré ==="
          cat latest.json

      - name: Upload latest.json to public repo release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.RELEASES_PAT }}
          repo_name: ${{ env.PUBLIC_REPO }}
          file: latest.json
          asset_name: latest.json
          tag: ${{ github.ref_name }}
          overwrite: true
