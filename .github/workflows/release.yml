name: Release FluXlock

# ─────────────────────────────────────────────────────────────
# Stratégie 2 repos :
#   - Repo PRIVÉ (fluxlock)          → code source, CI/CD
#   - Repo PUBLIC (fluxlock-releases) → installeurs + latest.json
#
# Fonctionnement :
#   1. tauri-action compile + crée une release DRAFT dans fluxlock (privé)
#   1b. build-android compile + signe l'APK (artefact)
#   2. "copy-to-public" copie tous les assets (+ l'APK) vers fluxlock-releases (public)
#   3. La release dans fluxlock reste en draft (invisible)
# ─────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"

env:
  PUBLIC_REPO: Tiemtore-dev/fluxlock-releases

jobs:
  # ──────────────────────────────────────────────────────────
  # ÉTAPE 1 — Compilation multi-plateforme
  # ──────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: ./tauri-desktop
        run: npm ci

      - name: Decode Tauri Private Key
        shell: python
        env:
          SECRET: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          import os, base64

          secret = os.environ.get("SECRET", "")
          is_base64 = False
          try:
              decoded = base64.b64decode(secret).decode('utf-8')
              if "untrusted comment:" in decoded:
                  is_base64 = True
          except Exception:
              pass

          if is_base64:
              final_key = secret.strip()
          else:
              if "untrusted comment:" in secret:
                  lines = secret.split("untrusted comment:")
                  if len(lines) > 1:
                      key_part = lines[1].strip()
                      if key_part.startswith("rsign encrypted secret key"):
                          key_part = key_part[len("rsign encrypted secret key"):].strip()
                      elif key_part.startswith("minisign encrypted secret key"):
                          key_part = key_part[len("minisign encrypted secret key"):].strip()
                      
                      proper_multiline = f"untrusted comment: rsign encrypted secret key\n{key_part}"
                  else:
                      proper_multiline = f"untrusted comment: rsign encrypted secret key\n{secret.strip()}"
              else:
                  proper_multiline = f"untrusted comment: rsign encrypted secret key\n{secret.strip()}"
              
              final_key = base64.b64encode(proper_multiline.encode('utf-8')).decode('utf-8')

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"\nTAURI_SIGNING_PRIVATE_KEY={final_key}\n")

      - name: Build Tauri app (draft release dans repo privé)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: "./tauri-desktop"
          tagName: ${{ github.ref_name }}
          releaseName: "FluXlock ${{ github.ref_name }}"
          releaseBody: "Release interne — assets copiés vers fluxlock-releases."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ──────────────────────────────────────────────────────────
  # ÉTAPE 1b — APK Android (signé, utilisé par la mise à jour in-app)
  # ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version de l'app
        run: |
          CONF_VERSION=$(jq -r .version tauri-desktop/src-tauri/tauri.conf.json)
          if [ "v${CONF_VERSION}" != "${{ github.ref_name }}" ]; then
            echo "::error::Le tag ${{ github.ref_name }} ne correspond pas à tauri.conf.json (${CONF_VERSION}) — la mise à jour Android compare ces versions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"

      - name: Set NDK_HOME
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Install Rust stable (cibles Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-desktop/src-tauri/target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: ./tauri-desktop
        run: npm ci

      - name: Decode Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : un APK non signé ne peut pas être installé."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: ./tauri-desktop
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --apk

      - name: Verify signature + rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK=$(find tauri-desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::Aucun APK produit"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p android-release
          # "universal" : AppUpdater.kt choisit l'APK selon l'ABI, sinon le universal
          cp "$APK" "android-release/FluXlock_${VERSION}_universal.apk"
          ls -lh android-release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-release/*.apk
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # ÉTAPE 2 — Copie des assets vers le repo public
  # ──────────────────────────────────────────────────────────
  publish-to-public:
    name: Publish to fluxlock-releases (public)
    needs: [build, build-android]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source repo (pour CHANGELOG)
        uses: actions/checkout@v4

      - name: Download all assets from private draft release
        uses: robinraju/release-downloader@v1.8
        with:
          tag: ${{ github.ref_name }}
          fileName: "*"
          out-file-path: "release-assets"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: List downloaded assets
        run: |
          echo "=== Assets téléchargés ==="
          ls -lh release-assets/

      - name: Create release in public repo + upload assets
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
          PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        run: |
          # Extraire les notes du CHANGELOG pour cette version
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md || echo "FluXlock ${TAG}")

          # Créer la release dans le repo public
          gh release create "$TAG" \
            --repo "$PUBLIC_REPO" \
            --title "FluXlock $TAG" \
            --notes "## 🔐 FluXlock ${TAG}

          ${NOTES}

          ### Télécharger l'installeur pour votre système

          | Plateforme | Fichier |
          |---|---|
          | macOS Apple Silicon (M1/M2/M3) | \`FluXlock_*_aarch64.dmg\` |
          | macOS Intel | \`FluXlock_*_x64.dmg\` |
          | Windows 10/11 (64-bit) | \`FluXlock_*_x64-setup.exe\` |
          | Linux (AppImage) | \`FluXlock_*_amd64.AppImage\` |
          | Android (mise à jour in-app ou installation manuelle) | \`FluXlock_*_universal.apk\` |" \
            --latest \
            release-assets/*

      - name: Build and upload latest.json manifest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ github.ref_name }}
          PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${PUBLIC_REPO}/releases/download/${TAG}"

          get_sig() {
            local f
            f=$(ls release-assets/$1 2>/dev/null | head -1)
            [ -f "$f" ] && cat "$f" || echo ""
          }

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "FluXlock ${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(get_sig "FluXlock_aarch64.app.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "$(get_sig "FluXlock_x64.app.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_x64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "$(get_sig "FluXlock_${VERSION}_amd64.AppImage.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_${VERSION}_amd64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$(get_sig "FluXlock_${VERSION}_x64_en-US.msi.zip.sig")",
                "url": "${BASE_URL}/FluXlock_${VERSION}_x64_en-US.msi.zip"
              }
            }
          }
          EOF

          echo "=== latest.json ==="
          cat latest.json

          gh release upload "$TAG" latest.json \
            --repo "$PUBLIC_REPO" \
            --clobber
