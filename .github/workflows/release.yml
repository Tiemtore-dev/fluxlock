name: Release FluXlock

# ─────────────────────────────────────────────────────────────
# Deux dépôts : fluxlock pour les sources/CI et fluxlock-releases pour les
# téléchargements et latest.json. Après validation de main, prepare crée le tag
# d'une nouvelle version sans jamais déplacer un tag existant. Le push du tag
# par GITHUB_TOKEN ne déclenche pas une deuxième exécution : cette invocation
# poursuit elle-même les builds et la publication. Les tags poussés explicitement
# restent compatibles avec le circuit de release et ses relances.
# Desktop, APK signé, extension et quatre relais doivent tous être disponibles
# avant de publier dans fluxlock-releases et d'actualiser les mises à jour.
# ─────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  PUBLIC_REPO: Tiemtore-dev/fluxlock-releases

jobs:
  prepare:
    name: Validate version and pin release commit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release guards
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Prepare immutable version tag
        id: release
        run: python3 scripts/release-metadata.py --github

  # ──────────────────────────────────────────────────────────
  # ÉTAPE 1 — Compilation multi-plateforme
  # ──────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: ./tauri-desktop
        run: npm ci

      - name: Decode Tauri Private Key
        shell: python
        env:
          SECRET: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          import os, base64

          secret = os.environ.get("SECRET", "")
          is_base64 = False
          try:
              decoded = base64.b64decode(secret).decode('utf-8')
              if "untrusted comment:" in decoded:
                  is_base64 = True
          except Exception:
              pass

          if is_base64:
              final_key = secret.strip()
          else:
              if "untrusted comment:" in secret:
                  lines = secret.split("untrusted comment:")
                  if len(lines) > 1:
                      key_part = lines[1].strip()
                      if key_part.startswith("rsign encrypted secret key"):
                          key_part = key_part[len("rsign encrypted secret key"):].strip()
                      elif key_part.startswith("minisign encrypted secret key"):
                          key_part = key_part[len("minisign encrypted secret key"):].strip()
                      
                      proper_multiline = f"untrusted comment: rsign encrypted secret key\n{key_part}"
                  else:
                      proper_multiline = f"untrusted comment: rsign encrypted secret key\n{secret.strip()}"
              else:
                  proper_multiline = f"untrusted comment: rsign encrypted secret key\n{secret.strip()}"
              
              final_key = base64.b64encode(proper_multiline.encode('utf-8')).decode('utf-8')

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"\nTAURI_SIGNING_PRIVATE_KEY={final_key}\n")

      - name: Préparer les autorisations Touch ID macOS
        if: matrix.platform == 'macos-latest'
        id: macos-signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing_dir="$RUNNER_TEMP/fluxlock-macos"
          if [[ -z "$APPLE_CERTIFICATE" && -z "$APPLE_SIGNING_IDENTITY" && -z "$APPLE_PROVISIONING_PROFILE" ]]; then
            mkdir -p "$signing_dir"
            echo '{"bundle":{"macOS":{"signingIdentity":"-"}}}' > "$signing_dir/config.json"
            echo "mode=compatibility" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/macos-signing.py prepare "$signing_dir"
            # Tauri tries to import a certificate when the variables are defined, even when empty.
            delimiter=$(uuidgen)
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -n "${!name}" || "$name" == APPLE_CERTIFICATE_PASSWORD ]]; then
                printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "${!name}" "$delimiter" >> "$GITHUB_ENV"
              fi
            done
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          fi
          echo "args=--config $signing_dir/config.json" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app (release interne)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: "./tauri-desktop"
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "FluXlock ${{ needs.prepare.outputs.tag }}"
          releaseBody: "Release interne — assets copiés vers fluxlock-releases."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.macos-signing.outputs.args }}

      - name: Vérifier le paquet macOS signé
        if: matrix.platform == 'macos-latest'
        env:
          SIGNING_MODE: ${{ steps.macos-signing.outputs.mode }}
        run: |
          app="tauri-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/FluXlock.app"
          case "$SIGNING_MODE" in
            developer-id) python3 scripts/macos-signing.py verify "$app" ;;
            compatibility) codesign --verify --deep --strict "$app" ;;
            *) echo "::error::Mode de signature macOS inconnu"; exit 1 ;;
          esac

      - name: Build native relay (macOS)
        if: matrix.platform == 'macos-latest'
        run: cargo build --locked --release --target ${{ matrix.target }} --manifest-path native-host/Cargo.toml

      - name: Package native relay (macOS)
        if: matrix.platform == 'macos-latest'
        run: python3 scripts/package-browser-release.py --target "${{ matrix.target }}" --output browser-release

      - name: Upload macOS browser relay artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-${{ matrix.target }}
          path: browser-release/*.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # ÉTAPE 1b — APK Android (signé, utilisé par la mise à jour in-app)
  # ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Vérifier que le tag correspond à la version de l'app
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          CONF_VERSION=$(jq -r .version tauri-desktop/src-tauri/tauri.conf.json)
          if [ "v${CONF_VERSION}" != "$TAG" ]; then
            echo "::error::Le tag $TAG ne correspond pas à tauri.conf.json (${CONF_VERSION})."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"

      - name: Set NDK_HOME
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Install Rust stable (cibles Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri-desktop/src-tauri/target
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: ./tauri-desktop
        run: npm ci

      - name: Decode Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant : un APK non signé ne peut pas être installé."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: ./tauri-desktop
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # arm64 + armv7 seulement (téléphones) : x86/x86_64 (émulateurs) alourdissaient l'APK de ~100 Mo
        run: npx tauri android build --apk --target aarch64 armv7

      - name: Verify signature + rename APK
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          APK=$(find tauri-desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::Aucun APK produit"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p android-release
          # Un seul APK multi-ABI (arm64-v8a + armeabi-v7a) : AppUpdater.kt prend le premier .apk
          cp "$APK" "android-release/FluXlock_${VERSION}_android.apk"
          ls -lh android-release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-release/*.apk
          if-no-files-found: error

  build-browser:
    name: Browser packages (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native relay
        run: cargo build --locked --release --target ${{ matrix.target }} --manifest-path native-host/Cargo.toml
      - name: Build extension once
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix tauri-desktop
          npm run build --prefix browser-extension
      - name: Package relay and extension
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then args+=(--extension); fi
          python3 scripts/package-browser-release.py --target "$TARGET" --output browser-release "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-release-${{ matrix.target }}
          path: browser-release/*.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # ÉTAPE 2 — Copie des assets vers le repo public
  # ──────────────────────────────────────────────────────────
  publish-to-public:
    name: Publish to fluxlock-releases (public)
    needs: [prepare, build, build-android, build-browser]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source repo (pour CHANGELOG)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Download desktop release assets
        uses: robinraju/release-downloader@v1.8
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          fileName: "*"
          out-file-path: "release-assets"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download extension and native relays
        uses: actions/download-artifact@v4
        with:
          pattern: browser-release-*
          merge-multiple: true
          path: release-assets

      - name: List downloaded assets
        run: |
          echo "=== Assets téléchargés ==="
          ls -lh release-assets/

      - name: Validate browser packages
        run: |
          python3 - <<'PY'
          import json, pathlib, re, zipfile
          root = pathlib.Path('.')
          extension = json.loads((root / 'browser-extension/manifest.json').read_text())['version']
          relay = re.search(r'^version = "([^"]+)"$', (root / 'native-host/Cargo.toml').read_text(), re.M).group(1)
          for name in [f'FluXlock-extension_{extension}.zip'] + [
              f'FluXlock-browser-host_{relay}_{target}.zip' for target in (
                  'aarch64-apple-darwin', 'x86_64-apple-darwin',
                  'x86_64-pc-windows-msvc', 'x86_64-unknown-linux-gnu')]:
              path = root / 'release-assets' / name
              assert path.is_file() and path.stat().st_size > 0, name
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None, name
          PY

      - name: Validate packages and build the update manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${PUBLIC_REPO}/releases/download/${TAG}"

          for asset in \
            "FluXlock_${VERSION}_aarch64.dmg" \
            "FluXlock_${VERSION}_x64.dmg" \
            "FluXlock_${VERSION}_x64-setup.exe" \
            "FluXlock_${VERSION}_amd64.AppImage" \
            "FluXlock_${VERSION}_android.apk"; do
            test -s "release-assets/$asset" || { echo "::error::Paquet manquant : $asset"; exit 1; }
          done

          for asset in FluXlock_aarch64.app.tar.gz FluXlock_x64.app.tar.gz \
            "FluXlock_${VERSION}_amd64.AppImage.tar.gz" "FluXlock_${VERSION}_x64_en-US.msi.zip"; do
            if [ ! -s "release-assets/$asset" ] || [ ! -s "release-assets/$asset.sig" ]; then
              echo "::error::Paquet de mise à jour ou signature manquante : $asset"
              exit 1
            fi
          done

          cat > release-assets/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "FluXlock ${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(cat "release-assets/FluXlock_aarch64.app.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "$(cat "release-assets/FluXlock_x64.app.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_x64.app.tar.gz"
              },
              "linux-x86_64": {
                "signature": "$(cat "release-assets/FluXlock_${VERSION}_amd64.AppImage.tar.gz.sig")",
                "url": "${BASE_URL}/FluXlock_${VERSION}_amd64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "$(cat "release-assets/FluXlock_${VERSION}_x64_en-US.msi.zip.sig")",
                "url": "${BASE_URL}/FluXlock_${VERSION}_x64_en-US.msi.zip"
              }
            }
          }
          EOF

          jq -e . release-assets/latest.json >/dev/null

      - name: Generate checksums for all release assets
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          folder = pathlib.Path('release-assets')
          with (folder / 'SHA256SUMS').open('w') as out:
              for path in sorted(folder.iterdir()):
                  if path.is_file() and path.name != 'SHA256SUMS':
                      digest = hashlib.sha256()
                      with path.open('rb') as src:
                          for chunk in iter(lambda: src.read(1024 * 1024), b''):
                              digest.update(chunk)
                      out.write(f'{digest.hexdigest()}  {path.name}\n')
          PY

      - name: Create release in public repo + upload assets
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        run: |
          # Extraire les notes du CHANGELOG pour cette version
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md || echo "FluXlock ${TAG}")

          # Créer la release dans le repo public
          gh release create "$TAG" \
            --repo "$PUBLIC_REPO" \
            --title "FluXlock $TAG" \
            --notes "## 🔐 FluXlock ${TAG}

          ${NOTES}

          ### Télécharger l'installeur pour votre système

          | Plateforme | Fichier |
          |---|---|
          | macOS Apple Silicon (M1/M2/M3) | \`FluXlock_*_aarch64.dmg\` |
          | macOS Intel | \`FluXlock_*_x64.dmg\` |
          | Windows 10/11 (64-bit) | \`FluXlock_*_x64-setup.exe\` |
          | Linux (AppImage) | \`FluXlock_*_amd64.AppImage\` |
          | Android (mise à jour in-app ou installation manuelle) | \`FluXlock_*_android.apk\` |
          | Extension Chromium (à décompresser) | \`FluXlock-extension_*.zip\` |
          | Relais natif de l’extension (selon OS/architecture) | \`FluXlock-browser-host_*.zip\` |

          Le fichier SHA256SUMS permet de vérifier les téléchargements. Pour l’extension, mettre à jour les trois composants et refaire l’appairage. L’installation du relais reste explicite ; le zip inclut les instructions." \
            --latest \
            release-assets/*
