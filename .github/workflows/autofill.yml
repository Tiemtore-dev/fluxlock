name: Browser extension and encrypted relay
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri-desktop/package-lock.json
      - run: npm ci
        working-directory: tauri-desktop
      - run: cargo test --locked --manifest-path autofill-protocol/Cargo.toml
      - run: cargo build --locked --example interop --manifest-path autofill-protocol/Cargo.toml
      - run: npm run build
        working-directory: browser-extension
      - run: npm test
        working-directory: browser-extension
      - name: Install isolated browser test tools
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/fluxlock-ui-tools" --ignore-scripts --no-audit --no-fund playwright@1.65.1 axe-core@4.10.3
      - name: Install test Chromium
        shell: bash
        run: node "$RUNNER_TEMP/fluxlock-ui-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify popup accessibility, forms and loaded extension
        working-directory: browser-extension
        shell: bash
        env:
          FLUXLOCK_PLAYWRIGHT: ${{ runner.temp }}/fluxlock-ui-tools/node_modules/playwright
          FLUXLOCK_AXE: ${{ runner.temp }}/fluxlock-ui-tools/node_modules/axe-core/axe.min.js
          FLUXLOCK_UI_OUTPUT: ${{ runner.temp }}/fluxlock-popup-verification
        run: |
          node tests/popup-ui.mjs
          node tests/browser.mjs
          node tests/extension.mjs
          node tests/popup-native.mjs
      - run: cargo test --locked --manifest-path native-host/Cargo.toml
      - run: cargo build --locked --release --manifest-path native-host/Cargo.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FluXlock-popup-${{ matrix.os }}
          path: ${{ runner.temp }}/fluxlock-popup-verification/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: FluXlock-browser-${{ matrix.os }}
          path: |
            browser-extension/dist/
            native-host/target/release/fluxlock-browser-host
            native-host/target/release/fluxlock-browser-host.exe
            scripts/install-browser-host.py
          if-no-files-found: error
