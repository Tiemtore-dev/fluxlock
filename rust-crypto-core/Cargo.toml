[package]
name = "secure-vault-crypto-core"
version = "1.0.0"
edition = "2021"
authors = ["SecureVault Team <security@securevault.dev>"]
description = "Military-grade cryptographic core for SecureVault Next-Gen"
license = "MIT"
repository = "https://github.com/securevault/crypto-core"

[lib]
name = "secure_vault_crypto"
crate-type = ["cdylib", "rlib"]  # Pour FFI et usage Rust natif

[dependencies]
# ═══════════════════════════════════════════════════════
# Chiffrement symétrique (résistant au quantique avec clé ≥256 bits)
# ═══════════════════════════════════════════════════════
chacha20poly1305 = { version = "0.10", features = ["std"] }  # RECOMMANDÉ : constant-time, pas d'AES-NI requis
aes-gcm = { version = "0.10", features = ["std"] }  # Rétrocompatibilité AES-256-GCM (v1 vaults) — remplace ring

# ═══════════════════════════════════════════════════════
# KDF — Dérivation de clés depuis mot de passe
# ═══════════════════════════════════════════════════════
argon2 = { version = "0.5", features = ["std", "zeroize"] }  # Argon2id — standard OWASP 2024

# ═══════════════════════════════════════════════════════
# PQC — Post-Quantum Cryptography (NIST Standards 2024)
# ═══════════════════════════════════════════════════════
# M05 — Mis à jour vers la dernière RC disponible. Passer à la version stable 0.3.0
# dès sa publication sur crates.io (surveiller https://crates.io/crates/ml-kem)
ml-kem = { version = "=0.3.0-rc.2", features = ["getrandom"] }  # ML-KEM-768 — FIPS 203
ml-dsa = { version = "=0.1.0-rc.8", features = ["zeroize"] }  # ML-DSA-65 — FIPS 204 (signatures PQ)
pkcs8 = "=0.11.0-rc.11" # Epinglé pour compatibilité avec ml-dsa 0.1.0-rc.8
getrandom = { version = "0.4", features = ["std"] }            # RNG compatible rand_core 0.10 (pour ml-dsa)

# ═══════════════════════════════════════════════════════
# Hash & MAC
# ═══════════════════════════════════════════════════════
sha3 = "0.10"                           # SHA3-256/512 — préféré pour vault PQC-native
sha2 = "0.10"                           # SHA-256 — rétrocompatibilité
hmac = "0.12"                           # HMAC pour intégrité vault header
blake3 = "1.5"                          # Hachage rapide (intégrité fichiers)
hkdf = "0.12"                           # HKDF pour dérivation multi-clés

# ═══════════════════════════════════════════════════════
# Signatures & échange de clés (rétrocompatibilité v1)
# ═══════════════════════════════════════════════════════
ed25519-dalek = "2.1"                   # Ed25519 — legacy, migration vers ML-DSA
x25519-dalek = "2.0"                    # X25519 — legacy, migration vers ML-KEM

# ═══════════════════════════════════════════════════════
# Sécurité mémoire
# ═══════════════════════════════════════════════════════
zeroize = { version = "1.7", features = ["derive", "std"] }
subtle = "2.5"                          # Comparaison constant-time

# ═══════════════════════════════════════════════════════
# Sérialisation
# ═══════════════════════════════════════════════════════
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.3"                       # MessagePack — format vault v2 (compact, non-ambigu)

# ═══════════════════════════════════════════════════════
# Utilitaires
# ═══════════════════════════════════════════════════════
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.21"
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }  # Benchmarking
proptest = "1.4"                        # Property-based testing
quickcheck = "1.0"                      # QuickCheck testing
tempfile = "3"                          # Temp dirs for migration tests

[features]
default = ["std"]
std = []
pqc = []                                # Post-Quantum Cryptography (ML-KEM, ML-DSA)
hsm = []                                # Hardware Security Module support

[profile.release]
opt-level = 3                           # Optimisation maximale
lto = true                              # Link-Time Optimization
codegen-units = 1                       # Une seule unité pour meilleure optimisation
strip = true                            # Strip des symboles de debug

[profile.bench]
opt-level = 3
lto = true

# Benchmarks commentés (fichier manquant)
# [[bench]]
# name = "crypto_benchmarks"
# harness = false
