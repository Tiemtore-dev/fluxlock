[package]
name = "secure-vault-crypto-core"
version = "1.0.0"
edition = "2021"
authors = ["SecureVault Team <security@securevault.dev>"]
description = "Military-grade cryptographic core for SecureVault Next-Gen"
license = "MIT"
repository = "https://github.com/securevault/crypto-core"

[lib]
name = "secure_vault_crypto"
crate-type = ["cdylib", "rlib"]  # Pour FFI et usage Rust natif

[dependencies]
# Cryptographie principale
ring = "0.17"                           # Primitives cryptographiques (Google's BoringSSL fork)
argon2 = "0.5"                          # Dérivation de clés (password hashing)
chacha20poly1305 = "0.10"               # Chiffrement alternatif
ed25519-dalek = "2.1"                   # Signatures numériques
x25519-dalek = "2.0"                    # Échange de clés Diffie-Hellman
hkdf = "0.12"                           # Key Derivation Function
hmac = "0.12"                           # HMAC pour authentification
sha2 = "0.10"                           # Fonctions de hachage SHA-2
sha3 = "0.10"                           # Fonctions de hachage SHA-3
blake3 = "1.5"                          # Hachage rapide et sécurisé

# Sécurité mémoire
zeroize = { version = "1.7", features = ["derive"] }  # Effacement sécurisé de la mémoire
secrecy = "0.8"                         # Wrapper pour données secrètes

# Sérialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Utilitaires
rand = "0.8"                            # Génération de nombres aléatoires
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.21"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"

# Post-Quantum Cryptography (préparation future)
# pqcrypto-kyber = "0.8"                # Chiffrement post-quantique
# pqcrypto-dilithium = "0.5"            # Signatures post-quantiques

# HSM Support (optionnel)
# pkcs11 = { version = "0.5", optional = true }

# Monitoring & Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }  # Benchmarking
proptest = "1.4"                        # Property-based testing
quickcheck = "1.0"                      # QuickCheck testing

[features]
default = ["std"]
std = []
hsm = []                                # Support Hardware Security Module
quantum-resistant = []                  # Algorithmes post-quantiques

[profile.release]
opt-level = 3                           # Optimisation maximale
lto = true                              # Link-Time Optimization
codegen-units = 1                       # Une seule unité pour meilleure optimisation
strip = true                            # Strip des symboles de debug

[profile.bench]
opt-level = 3
lto = true

# Benchmarks commentés (fichier manquant)
# [[bench]]
# name = "crypto_benchmarks"
# harness = false
